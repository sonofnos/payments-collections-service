name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (unit + Testcontainers integration)
        run: ./mvnw -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # SonarCloud static analysis. Requires the SONAR_TOKEN secret from a
      # sonarcloud.io signup (Sign in with GitHub -> Analyze new project ->
      # generate token -> add as repo secret SONAR_TOKEN), which is a manual,
      # interactive step that can't be provisioned from a script. This step
      # is a no-op until that secret exists.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=sonofnos_payments-collections-service
          -Dsonar.organization=sonofnos
          -Dsonar.host.url=https://sonarcloud.io

  docker-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t payments-collections-service:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payments-collections-service:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0' # report, don't fail the build on findings for a portfolio project
